<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FB Manager AI</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; width: 300px; margin: 0; background: #f6f8f8; color: #263c3b; }
    .header { background: #167368; color: white; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
    .header h1 { font-size: 13px; font-weight: 600; margin: 0; }
    .header small { font-size: 9px; opacity: .75; display: block; margin-top: 2px; }
    .content { padding: 14px 16px; }
    .group-info { background: white; border: 1px solid #e5ebea; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .group-name { font-size: 12px; font-weight: 600; margin: 0 0 4px; }
    .group-url { font-size: 10px; color: #7c8c8b; word-break: break-all; }
    .btn { width: 100%; padding: 10px; background: #167368; color: white; border: none; border-radius: 7px; font: 600 12px/1 inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:hover { background: #135e56; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-outline { background: transparent; color: #167368; border: 1px solid #167368; margin-top: 8px; }
    .btn-outline:hover { background: #eff5f3; }
    .status { font-size: 11px; padding: 8px 10px; border-radius: 6px; margin-top: 10px; }
    .status.success { background: #eaf5ee; color: #28896c; }
    .status.error { background: #fcf0ef; color: #b45b4d; }
    .status.info { background: #eef2fb; color: #5e7bb2; }
    .not-group { text-align: center; padding: 20px; color: #7c8c8b; font-size: 11px; }
    .note { font-size: 9px; color: #7c8c8b; text-align: center; margin-top: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>FB Manager AI</h1>
      <small>Save Group / Fanpage — Tùy chọn</small>
    </div>
  </div>
  <div class="content" id="content">
    <div class="not-group">Đang kiểm tra trang…</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
